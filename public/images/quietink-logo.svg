<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients matching the QuietInk emblem -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE66"/>
      <stop offset="40%" stop-color="#C59B46"/>
      <stop offset="70%" stop-color="#DFB15B"/>
      <stop offset="100%" stop-color="#A57A28"/>
    </linearGradient>

    <linearGradient id="goldFeather" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4"/>
      <stop offset="35%" stop-color="#E8BE65"/>
      <stop offset="70%" stop-color="#C89D44"/>
      <stop offset="100%" stop-color="#9A7326"/>
    </linearGradient>

    <linearGradient id="goldFeatherVane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFB15B"/>
      <stop offset="50%" stop-color="#FCE6A9"/>
      <stop offset="100%" stop-color="#B88B35"/>
    </linearGradient>

    <linearGradient id="bookPageWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4EEDF"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Disc -->
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" />

  <!-- Outer Double Gold Rings -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldRing)" stroke-width="8" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldRing)" stroke-width="2.5" />

  <!-- Celestial Halo Arc behind the Quill -->
  <path d="M 180 185 A 110 110 0 0 1 350 200" fill="none" stroke="#E2BC67" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 230 140 A 100 100 0 0 1 340 170" fill="none" stroke="#E2BC67" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Golden 4-Point Stars / Sparkles -->
  <!-- Top Main Star -->
  <g transform="translate(202, 160)">
    <path d="M 0 -16 Q 1.5 -3 16 0 Q 1.5 3 0 16 Q -1.5 3 -16 0 Q -1.5 -3 0 -16 Z" fill="url(#goldRing)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFF9E6" />
  </g>

  <!-- Smaller Second Star -->
  <g transform="translate(182, 184) scale(0.65)">
    <path d="M 0 -16 Q 1.5 -3 16 0 Q 1.5 3 0 16 Q -1.5 3 -16 0 Q -1.5 -3 0 -16 Z" fill="url(#goldRing)" />
    <circle cx="0" cy="0" r="2" fill="#FFF9E6" />
  </g>

  <!-- Tiny Accent Sparkle -->
  <circle cx="340" cy="180" r="2" fill="#DFB15B" />

  <!-- ==================== THE OPEN BOOK ==================== -->
  <g id="open-book">
    <!-- Book Base Trim & Spine Shadow (Black & Gold) -->
    <path d="M 105 278 C 160 286 215 275 250 284 C 285 275 340 286 395 278 C 400 288 385 305 320 318 C 280 326 260 322 250 324 C 240 322 220 326 180 318 C 115 305 100 288 105 278 Z" fill="#141312" />
    <path d="M 112 284 C 165 292 215 282 250 290 C 285 282 335 292 388 284 C 382 296 345 316 250 320 C 155 316 118 296 112 284 Z" fill="url(#goldRing)" opacity="0.9" />

    <!-- Open Book Lower Pages Block -->
    <path d="M 115 274 C 165 282 215 273 250 280 C 285 273 335 282 385 274 C 390 283 365 304 250 307 C 135 304 110 283 115 274 Z" fill="#EAE2CE" />

    <!-- Left Open Page -->
    <path d="M 250 274 C 215 264 165 254 118 266 C 110 274 118 285 125 287 C 168 277 218 284 250 293 Z" fill="url(#bookPageWarm)" stroke="#D8CDBA" stroke-width="1.2" />

    <!-- Right Open Page -->
    <path d="M 250 274 C 285 264 335 254 382 266 C 390 274 382 285 375 287 C 332 277 282 284 250 293 Z" fill="url(#bookPageWarm)" stroke="#D8CDBA" stroke-width="1.2" />

    <!-- Center Spine Fold Line -->
    <line x1="250" y1="273" x2="250" y2="307" stroke="#3A332A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Gold Center Bookmark Ribbon -->
    <path d="M 246 307 L 254 307 L 254 328 L 250 324 L 246 328 Z" fill="url(#goldRing)" />
  </g>

  <!-- ==================== THE INK CALLIGRAPHY SWOOSH ==================== -->
  <!-- Fluid black ink cursive line looping dynamically from the quill across right page -->
  <path d="M 224 268 C 248 248 276 250 310 258 C 332 263 342 270 330 275 C 314 282 280 270 248 278 C 235 281 228 286 220 290"
        fill="none" stroke="#181716" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ==================== THE GOLDEN FEATHER QUILL PEN ==================== -->
  <g id="feather-quill">
    <!-- Main Feather Silhouette & Vanes -->
    <g transform="rotate(32 250 220)">
      <!-- Left Vane with natural feather notches -->
      <path d="M 248 95 C 248 95 210 125 210 185 C 210 198 220 205 215 215 C 210 225 225 235 220 248 C 218 253 235 260 246 270 L 248 270 Z"
            fill="url(#goldFeather)" />

      <!-- Right Vane with natural cuts -->
      <path d="M 252 95 C 252 95 290 125 290 185 C 290 200 278 206 284 218 C 288 227 274 236 278 248 C 280 254 265 262 254 270 L 252 270 Z"
            fill="url(#goldFeatherVane)" />

      <!-- Internal Feather Texture Slits -->
      <path d="M 248 135 L 222 155 M 248 165 L 216 190 M 248 195 L 223 218 M 248 225 L 228 245"
            stroke="#9E7627" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 252 140 L 278 160 M 252 170 L 284 195 M 252 200 L 277 222 M 252 230 L 272 250"
            stroke="#9E7627" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Feather Central Shaft / Rachis -->
      <path d="M 250 90 L 250 278" stroke="#FFF2CC" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 250.8 92 L 250.8 278" stroke="#87621B" stroke-width="1" stroke-linecap="round" opacity="0.7" />

      <!-- Pen Nib / Metal Ferrule Section -->
      <path d="M 244 274 L 256 274 L 254 286 L 250 300 L 246 286 Z" fill="#1A1816" />
      <path d="M 245 274 L 255 274 L 253 285 L 250 298 L 247 285 Z" fill="url(#goldRing)" stroke="#1A1816" stroke-width="1.2" />

      <!-- Nib Breather Hole & Nib Slit -->
      <circle cx="250" cy="285" r="1" fill="#1A1816" />
      <line x1="250" y1="286" x2="250" y2="299" stroke="#1A1816" stroke-width="1" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY SECTION ==================== -->
  <!-- "QuietInk" Title: "Quiet" in dark charcoal, "Ink" in gold -->
  <g transform="translate(250, 392)">
    <text text-anchor="middle" font-family="'Lora', 'Cormorant Garamond', serif" font-size="64" font-weight="700" letter-spacing="-1">
      <tspan fill="#1A1816">Quiet</tspan><tspan fill="url(#goldRing)">Ink</tspan>
    </text>
  </g>

  <!-- Subtitle: "YOUR JOURNAL, YOUR SPACE" -->
  <g transform="translate(250, 420)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14.5" font-weight="600" fill="#2E2A27" letter-spacing="4.5">
      YOUR JOURNAL, YOUR SPACE
    </text>
  </g>

  <!-- Elegant Bottom Gold Divider with Center Dot: ─── ● ─── -->
  <g transform="translate(250, 438)">
    <line x1="-80" y1="0" x2="-14" y2="0" stroke="url(#goldRing)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3.6" fill="url(#goldRing)" />
    <line x1="14" y1="0" x2="80" y2="0" stroke="url(#goldRing)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
